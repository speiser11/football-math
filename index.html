<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Football Math</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#060a12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Football Math">
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800;900&family=Saira:wght@500;600;700&family=DotGothic16&display=swap" rel="stylesheet">
<style>
  :root{ --gold:#ffd23f; --blue:#3fa9f5; --ink:#e9f0f8; --mute:#9fb6cc; --glass:rgba(10,18,32,.84); --line:rgba(255,255,255,.14); --red:#e0533a; --green:#2e9e4f; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; background:#060a12; color:var(--ink); font-family:'Saira',system-ui,sans-serif; min-height:100%}
  body{display:flex; justify-content:center; user-select:none; -webkit-user-select:none;
    background:radial-gradient(ellipse 70% 40% at 50% 0%,rgba(120,170,255,.16),transparent 70%),#060a12}
  .app{width:100%; max-width:980px; padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left)); display:flex; flex-direction:column; gap:8px; min-height:100vh}
  button{font-family:inherit; cursor:pointer; border:none; touch-action:manipulation; color:inherit}
  .cf{font-family:'Saira Condensed',sans-serif}
  .glass{background:var(--glass); border:1px solid var(--line); border-radius:14px; box-shadow:0 10px 30px rgba(0,0,0,.4)}
  .label{font-family:'Saira Condensed'; font-weight:700; font-size:12px; letter-spacing:2px; color:var(--mute); text-transform:uppercase}

  /* ---------- start ---------- */
  .start{display:flex; flex-direction:column; gap:16px; align-items:center; text-align:center; padding:14px 4px 30px}
  .title{font-family:'Saira Condensed'; font-weight:900; font-style:italic; font-size:clamp(52px,12vw,104px); line-height:.86; letter-spacing:1px; margin:6px 0 0}
  .title span{display:block; color:var(--gold)}
  .tagline{color:var(--mute); font-weight:600; margin:0}
  .matchup{display:flex; align-items:center; gap:14px; justify-content:center; flex-wrap:wrap}
  .tcard{display:flex; flex-direction:column; align-items:center; gap:4px; padding:12px 14px 10px; min-width:150px; border-radius:16px; border:1px solid var(--line); background:var(--glass)}
  .tcard .nm{font-family:'Saira Condensed'; font-weight:900; font-size:24px; line-height:1}
  .tcard .chg{font-size:12px; color:var(--blue); font-weight:700}
  .vs{font-family:'Saira Condensed'; font-weight:900; font-size:28px; color:var(--mute)}
  .opt{display:flex; flex-direction:column; gap:6px; align-items:center}
  .seg{display:flex; gap:6px; flex-wrap:wrap; justify-content:center}
  .seg button{background:rgba(255,255,255,.06); border:1px solid var(--line); padding:9px 14px; border-radius:12px; font-family:'Saira Condensed'; font-weight:800; font-size:18px; min-width:90px}
  .seg button small{display:block; font-family:'Saira'; font-weight:600; font-size:11px; color:var(--mute)}
  .seg button.on{background:#13385a; border-color:var(--blue); box-shadow:0 0 0 3px rgba(63,169,245,.2)}
  .cta{background:var(--gold); color:#111; font-family:'Saira Condensed'; font-weight:900; font-size:30px; letter-spacing:2px; padding:12px 46px; border-radius:16px; box-shadow:0 0 30px rgba(255,210,63,.35)}
  .cta:active{transform:translateY(2px)}
  .ghost{background:rgba(255,255,255,.06); border:1px solid var(--line); padding:10px 18px; border-radius:12px; font-family:'Saira Condensed'; font-weight:800; font-size:18px}
  .record{color:var(--mute); font-size:14px}
  details.settings{width:100%; max-width:520px; padding:10px 14px}
  details.settings summary{list-style:none; cursor:pointer; font-family:'Saira Condensed'; font-weight:800; color:var(--mute); text-align:center}
  .setrow{display:flex; flex-direction:column; gap:6px; align-items:center; margin-top:12px}
  .note{font-size:12px; color:var(--mute); max-width:420px}

  /* team picker */
  .modal{position:fixed; inset:0; background:rgba(3,6,12,.94); z-index:40; display:flex; flex-direction:column; align-items:center; padding:16px; overflow:auto}
  .modal h2{font-family:'Saira Condensed'; font-weight:900; font-size:28px; margin:4px 0 12px}
  .tgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:8px; width:100%; max-width:880px}
  .tbtn{background:rgba(255,255,255,.05); border:1px solid var(--line); border-radius:12px; padding:8px 4px; display:flex; flex-direction:column; align-items:center; gap:2px; font-weight:700; font-size:12px}
  .tbtn.on{border-color:var(--gold); box-shadow:0 0 0 3px rgba(255,210,63,.2)}

  /* ---------- broadcast ---------- */
  .fieldwrap{position:relative; border-radius:16px; overflow:hidden; border:1px solid var(--line); background:#05080e}
  #cv{display:block; width:100%; height:clamp(230px,48vw,440px); transition:filter .35s}
  .fieldwrap.dim #cv{filter:brightness(.45) saturate(.8)}
  .topbar{position:absolute; left:10px; right:10px; top:8px; display:flex; justify-content:space-between; gap:8px; pointer-events:none}
  .wp{padding:6px 10px; width:clamp(150px,30%,240px)}
  .wpbar{display:flex; height:8px; border-radius:4px; overflow:hidden; margin:4px 0 2px}
  .wpnums{display:flex; justify-content:space-between; font-family:'Saira Condensed'; font-weight:800; font-size:14px}
  .mom{display:flex; align-items:center; gap:8px; padding:4px 12px 4px 4px; border-radius:40px}
  .mom .t{font-family:'Saira Condensed'; font-weight:800; font-size:14px; line-height:1.05; text-align:left}
  .mom .t small{display:block; color:var(--mute); font-size:11px; font-weight:700}
  .mom.boost{border-color:var(--gold); box-shadow:0 0 18px rgba(255,210,63,.5)}
  .stadium{position:absolute; top:10px; left:50%; transform:translateX(-50%); font-family:'Saira Condensed'; font-weight:700; font-size:12px; letter-spacing:2px; text-transform:uppercase; color:#cfd8e3; background:rgba(0,0,0,.45); padding:2px 10px; border-radius:20px; white-space:nowrap}
  .bug{position:absolute; left:50%; transform:translateX(-50%); bottom:8px; display:flex; align-items:stretch; border-radius:10px; overflow:hidden; box-shadow:0 8px 24px rgba(0,0,0,.55); font-family:'Saira Condensed'; white-space:nowrap}
  .bug .tm{display:flex; align-items:center; gap:7px; padding:3px 12px}
  .bug .ab{font-weight:900; font-size:18px; letter-spacing:1px}
  .bug .sc{font-weight:800; font-size:30px; line-height:1}
  .bug .poss{width:7px; height:7px; border-radius:50%; background:var(--gold); visibility:hidden}
  .bug .poss.on{visibility:visible}
  .bug .mid{background:rgba(8,12,20,.94); display:flex; align-items:center; gap:10px; padding:3px 12px}
  .bug .q{font-weight:700; font-size:16px} .bug .clk{font-weight:800; font-size:20px; font-variant-numeric:tabular-nums}
  .bug .dd{background:var(--gold); color:#111; font-weight:900; font-size:15px; padding:1px 8px; border-radius:5px}
  .lower{display:flex; align-items:stretch; min-height:40px; border-radius:10px; overflow:hidden; background:var(--glass); border:1px solid var(--line)}
  .lower .bar{width:8px}
  .lower .txt{flex:1; display:flex; align-items:center; padding:4px 12px; font-family:'Saira Condensed'; font-weight:800; font-size:clamp(17px,3.6vw,24px); letter-spacing:.3px}
  .lower .txt.good{color:var(--gold)} .lower .txt.bad{color:#ff9a80} .lower .txt.info{color:#bfe3ff}
  .hud{display:flex; gap:6px; align-items:center; padding:0 6px}
  .hud button{width:38px; height:38px; border-radius:10px; background:var(--glass); border:1px solid var(--line); display:flex; align-items:center; justify-content:center}

  /* ---------- panel ---------- */
  .panel{display:flex; flex-direction:column; gap:10px; flex:1}
  .ptitle{font-family:'Saira Condensed'; font-weight:900; font-size:22px; letter-spacing:.5px; text-align:center}
  .ptitle.def{color:#ff9a80}
  .plays{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px}
  .play{background:var(--glass); border:1px solid var(--line); border-radius:16px; padding:8px; display:flex; flex-direction:column; gap:6px; align-items:stretch; text-align:left}
  .play:active{transform:translateY(2px)}
  .play svg{width:100%; height:auto; border-radius:10px; display:block}
  .play .nm{font-family:'Saira Condensed'; font-weight:900; font-size:22px; line-height:1}
  .play .yd{font-family:'Saira Condensed'; font-weight:700; font-size:15px; color:var(--blue)}
  .play .mt{font-size:12px; font-weight:600; color:#cfd8e3; line-height:1.2}
  .pips{display:flex; gap:3px} .pips i{width:18px; height:5px; border-radius:3px; background:rgba(255,255,255,.18)} .pips i.on{background:var(--gold)}
  .extras{display:flex; gap:8px; justify-content:center; flex-wrap:wrap}
  .look{display:flex; align-items:center; gap:10px; padding:8px 12px; border-left:5px solid}
  .look .lk{font-family:'Saira Condensed'; font-weight:900; font-size:18px; letter-spacing:.5px}
  .look .tip{font-size:13px; font-weight:600; color:#cfd8e3; line-height:1.3}
  .boostnote{text-align:center; font-family:'Saira Condensed'; font-weight:800; color:var(--gold); font-size:16px}
  .waiting{text-align:center; font-family:'Saira Condensed'; font-weight:900; font-size:26px; color:var(--mute); padding:18px 0; letter-spacing:2px}

  /* snap */
  .snap{padding:14px; display:flex; flex-direction:column; gap:10px}
  .snaphead{display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap}
  .badge{font-family:'Saira Condensed'; font-weight:900; font-size:15px; letter-spacing:1px; padding:3px 10px; border-radius:7px; color:#fff}
  .sit{font-family:'Saira Condensed'; font-weight:700; font-size:15px; color:#cfd8e3}
  .shot{display:flex; align-items:center; gap:8px}
  .shot .tr{flex:1; height:8px; border-radius:4px; background:rgba(255,255,255,.12); overflow:hidden}
  .shot .fl{height:100%; width:100%; background:var(--gold); box-shadow:0 0 12px var(--gold)}
  .shot .fl.low{background:var(--red); box-shadow:0 0 12px var(--red)}
  .shot .n{font-family:'Saira Condensed'; font-weight:900; font-size:22px; color:var(--gold); min-width:58px; text-align:right}
  .eqrow{display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap}
  .eq{font-family:'Saira Condensed'; font-weight:900; font-size:clamp(56px,13vw,112px); line-height:.9; letter-spacing:-1px}
  .eq.story{font-family:'Saira'; font-weight:700; font-size:clamp(18px,4.2vw,26px); line-height:1.35; letter-spacing:0; text-align:center}
  .eqs{font-family:'Saira Condensed'; font-weight:800; font-size:clamp(44px,10vw,84px); color:var(--mute)}
  .ans{min-width:120px; height:clamp(70px,15vw,110px); border-radius:16px; border:3px solid var(--gold); box-shadow:0 0 0 5px rgba(255,210,63,.13); display:flex; align-items:center; justify-content:center; font-family:'Saira Condensed'; font-weight:900; font-size:clamp(48px,11vw,90px); color:var(--gold); padding:0 14px}
  .film{display:flex; justify-content:center}
  .film button{font-family:'Saira Condensed'; font-weight:800; font-size:15px; color:var(--blue); background:rgba(63,169,245,.1); border:1px solid rgba(63,169,245,.35); padding:5px 12px; border-radius:10px}
  .pad{display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:7px}
  .pad button{height:56px; border-radius:12px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.16); font-family:'Saira Condensed'; font-weight:800; font-size:28px}
  .pad button:active{background:rgba(255,255,255,.18)}
  .pad .del{font-size:18px; color:#cfd8e3}
  .pad .go{grid-column:span 6; background:var(--gold); color:#111; font-weight:900; letter-spacing:3px; font-size:28px; box-shadow:0 0 20px rgba(255,210,63,.35); border:none}
  @media (min-width:640px){ .pad{grid-template-columns:repeat(12,minmax(0,1fr))} .pad .go{grid-column:span 12} }
  .fb{display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center; padding:10px}
  .fb .yay{font-family:'Saira Condensed'; font-weight:900; font-size:38px; color:#5fe08a}
  .fb .burst{font-family:'Saira Condensed'; font-weight:900; font-size:20px; color:var(--gold)}
  .fb .oops{font-family:'Saira Condensed'; font-weight:900; font-size:28px; color:#ff9a80}
  .fb .eqline{font-family:'Saira Condensed'; font-weight:900; font-size:34px}
  .hint{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; max-width:640px}
  .grp{display:flex; flex-wrap:wrap; gap:4px; padding:6px; border:2px dashed rgba(159,182,204,.5); border-radius:10px; max-width:140px; justify-content:center}
  .dot{width:15px; height:15px; border-radius:50%; background:var(--blue)}
  .dot.s{background:#cfd8e3}
  .dot.x{background:rgba(255,255,255,.15); position:relative}
  .dot.x::after{content:'✕'; position:absolute; inset:0; color:#ff9a80; font-weight:900; font-size:12px; display:flex; align-items:center; justify-content:center}
  .htext{font-weight:600; color:#cfd8e3; font-size:15px}
  .cont{background:var(--blue); color:#04121f; font-family:'Saira Condensed'; font-weight:900; font-size:22px; padding:10px 30px; border-radius:14px}
  .stops{display:flex; gap:8px; justify-content:center}
  .stop{width:36px; height:36px; border-radius:50%; border:2px solid var(--line); display:flex; align-items:center; justify-content:center; font-family:'Saira Condensed'; font-weight:900}
  .stop.ok{border-color:#5fe08a; color:#5fe08a} .stop.no{border-color:#ff9a80; color:#ff9a80}

  /* halftime: retro LED board */
  .led{background:#04050a; border:5px solid #5d63c9; box-shadow:inset 0 0 0 2px #1a1d4d; border-radius:6px; padding:14px; display:flex; flex-direction:column; gap:12px}
  .ledt{font-family:'DotGothic16',monospace; color:#ffc93c; text-shadow:0 0 6px rgba(255,190,40,.8)}
  .ledg{font-family:'DotGothic16',monospace; color:#7dff7d; text-shadow:0 0 6px rgba(80,255,80,.7)}
  .clue{font-family:'Saira'; font-weight:600; font-size:clamp(16px,3.6vw,21px); line-height:1.35; color:#fff}
  .clue b{color:#ffc93c}
  .match{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,2fr); gap:12px}
  .chips{display:flex; flex-direction:column; gap:8px}
  .chip{border:2px solid #4a8a4a; background:#071a07; color:#fff; font-family:'Saira Condensed'; font-weight:800; font-size:18px; padding:8px 6px; border-radius:6px}
  .chip.sel{border-color:#ffc93c; box-shadow:0 0 10px rgba(255,201,60,.6)}
  .chip.used{opacity:.45}
  .rows{display:grid; grid-template-columns:minmax(0,1.4fr) minmax(0,1fr); gap:8px}
  .rows .h{font-family:'Saira Condensed'; font-weight:800; font-size:14px; color:#cfd8e3; text-align:center; letter-spacing:1px}
  .slot{border:2px solid #4a8a4a; background:#071a07; color:#fff; font-family:'Saira Condensed'; font-weight:800; font-size:17px; padding:8px 4px; text-align:center; border-radius:6px}
  .slot.empty{color:#9fd08f}
  .slot.right{border-color:#5fe08a} .slot.wrong{border-color:#ff6b52}
  .num{font-family:'DotGothic16',monospace; color:#ffc93c; font-size:26px; display:flex; align-items:center; justify-content:center; text-shadow:0 0 6px rgba(255,190,40,.6)}
  .hike{background:none; padding:0; align-self:center}

  /* locker */
  .locker{display:flex; flex-direction:column; gap:14px; padding-bottom:30px}
  .lhead{display:flex; justify-content:space-between; align-items:flex-end; gap:10px; flex-wrap:wrap}
  .lhead h1{font-family:'Saira Condensed'; font-weight:900; font-size:44px; margin:0; line-height:1}
  .cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px}
  .pcard{border-radius:16px; padding:2px}
  .pcard .in{border-radius:14px; background:#0a1626; padding:12px; display:flex; flex-direction:column; gap:6px; height:100%}
  .pcard .rt{display:flex; justify-content:space-between; align-items:flex-start}
  .pcard .rating{font-family:'Saira Condensed'; font-weight:900; font-size:46px; line-height:.85}
  .pcard .tier{font-family:'Saira Condensed'; font-weight:800; font-size:11px; letter-spacing:2px; border:1px solid; border-radius:6px; padding:1px 6px}
  .pcard .who{display:flex; align-items:center; gap:8px}
  .pcard .no{font-family:'Saira Condensed'; font-weight:900; font-size:24px; line-height:1}
  .pcard .pos{font-family:'Saira Condensed'; font-weight:800; font-size:13px; color:var(--blue); letter-spacing:1px}
  .pcard .name{font-family:'Saira Condensed'; font-weight:800; font-size:19px; line-height:1.05}
  .pcard .pw{font-size:12px; color:var(--mute); font-weight:600}
  .pcard .prog{display:flex; gap:2px; margin-top:auto} .pcard .prog i{flex:1; height:6px; border-radius:2px; background:rgba(255,255,255,.14)} .pcard .prog i.on{background:var(--gold)}
  .pcard .pn{font-family:'Saira Condensed'; font-weight:700; font-size:12px; color:#cfd8e3}
  .map{padding:14px}
  .mgrid{display:grid; grid-template-columns:22px repeat(10,minmax(0,1fr)); gap:3px; margin-top:8px}
  .mgrid div{height:20px; border-radius:3px; font-family:'Saira Condensed'; font-weight:800; font-size:12px; color:var(--mute); display:flex; align-items:center; justify-content:center}
  .legend{display:flex; gap:14px; flex-wrap:wrap; margin-top:10px; font-size:12px; color:#cfd8e3}
  .legend span{display:flex; align-items:center; gap:5px} .legend i{width:11px; height:11px; border-radius:3px; display:inline-block}

  /* end */
  .end{display:flex; flex-direction:column; align-items:center; gap:12px; text-align:center; padding:8px}
  .end h2{font-family:'Saira Condensed'; font-weight:900; font-size:44px; margin:0; line-height:1}
  .final{font-family:'Saira Condensed'; font-weight:800; font-size:24px}
  .statrow{display:flex; gap:8px; flex-wrap:wrap; justify-content:center}
  .stat{padding:8px 14px; font-weight:600; font-size:13px; color:var(--mute)}
  .stat b{display:block; font-family:'Saira Condensed'; font-weight:900; font-size:28px; color:#fff}
  .ups{padding:10px 14px; font-family:'Saira Condensed'; font-weight:800; font-size:17px; color:var(--gold)}
  .practice{padding:10px 14px; font-weight:600; max-width:560px}
  .pchips{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:6px}
  .pchip{background:rgba(255,255,255,.08); border-radius:8px; padding:3px 10px; font-family:'Saira Condensed'; font-weight:800; font-size:18px}
  .confetti{position:fixed; top:-20px; width:10px; height:16px; z-index:50; pointer-events:none; animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
  .hidden{display:none!important}
  @media (max-width:560px){
    .bug .sc{font-size:22px} .bug .ab{font-size:14px} .bug .clk{font-size:16px} .bug .q{font-size:13px} .bug .dd{font-size:12px} .bug .tm{padding:2px 8px} .bug .mid{gap:6px; padding:2px 8px}
    .wp{width:auto; padding:4px 8px} .wp .label{font-size:9px; letter-spacing:1px} .wpnums{font-size:12px; gap:8px} .wpbar{width:110px} .mom{padding:2px 8px 2px 2px} .mom svg{width:30px;height:30px} .mom .t{font-size:12px} .mom .t small{display:none}
    .play .nm{font-size:17px} .play .mt{font-size:10px}
    .pad button{height:50px; font-size:24px}
    .stadium{display:none}
  }
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>

/* =========================================================
   LEAGUE — city, name, colors (c1 main, c2 accent, h helmet), stadium.
   logo: '' shows a colored circle. For home use you can paste an
   image data: URI into logo.
   ========================================================= */
const TEAMS={
  ARI:{city:'Arizona',name:'Cardinals',c1:'#97233F',c2:'#FFB612',h:'#FFFFFF',stadium:'State Farm Stadium'},
  ATL:{city:'Atlanta',name:'Falcons',c1:'#A71930',c2:'#000000',h:'#101820',stadium:'Mercedes-Benz Stadium'},
  BAL:{city:'Baltimore',name:'Ravens',c1:'#241773',c2:'#9E7C0C',h:'#101820',stadium:'M&T Bank Stadium'},
  BUF:{city:'Buffalo',name:'Bills',c1:'#00338D',c2:'#C60C30',h:'#FFFFFF',stadium:'Highmark Stadium'},
  CAR:{city:'Carolina',name:'Panthers',c1:'#0085CA',c2:'#101820',h:'#A5ACAF',stadium:'Bank of America Stadium'},
  CHI:{city:'Chicago',name:'Bears',c1:'#0B162A',c2:'#C83803',stadium:'Soldier Field'},

let MASTER=null, NOISE=null, BED=null;
function out(){ const c=ac(); if(!c) return null; if(!MASTER){ const comp=c.createDynamicsCompressor(); comp.threshold.value=-16; comp.knee.value=10; comp.ratio.value=4; comp.attack.value=.004; comp.release.value=.25; const g=c.createGain(); g.gain.value=.95; comp.connect(g); g.connect(c.destination); MASTER=comp; } return MASTER; }

function nz({dur=.3,type='bandpass',f=1000,f2=null,q=.7,v=.3,a=.01,when=0}={}){ const c=ac(); if(!c||!sfxOn())return; const t=c.currentTime+when; const s=c.createBufferSource(); s.buffer=noiseBuf(); s.loop=true; const fl=c.createBiquadFilter(); fl.type=type; fl.frequency.setValueAtTime(f,t); if(f2) fl.frequency.exponentialRampToValueAtTime(f2,t+dur); fl.Q.value=q; const g=c.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(Math.max(.0002,v),t+a); g.gain.exponentialRampToValueAtTime(.0001,t+dur); s.connect(fl); fl.connect(g); g.connect(out()); s.start(t,Math.random()*1.5); s.stop(t+dur+.05); }
function osc({f=440,f2=null,dur=.3,type='sine',v=.2,a=.005,when=0,lp=null}={}){ const c=ac(); if(!c||!sfxOn())return; const t=c.currentTime+when; const o=c.createOscillator(); o.type=type; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur); const g=c.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(v,t+a); g.gain.exponentialRampToValueAtTime(.0001,t+dur); let n=o; if(lp){ const fl=c.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=lp; o.connect(fl); n=fl; } n.connect(g); g.connect(out()); o.start(t); o.stop(t+dur+.05); }

function hutVoice(when=0){ const c=ac(); if(!c||!sfxOn())return; const t=c.currentTime+when; const o=c.createOscillator(); o.type='sawtooth'; o.frequency.setValueAtTime(155,t); o.frequency.exponentialRampToValueAtTime(100,t+.15);
  const g=c.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.55,t+.015); g.gain.exponentialRampToValueAtTime(.0001,t+.17);
  for(const [f,q] of [[640,4],[1150,6]]){ const b=c.createBiquadFilter(); b.type='bandpass'; b.frequency.value=f; b.Q.value=q; o.connect(b); b.connect(g); }
  g.connect(out()); o.start(t); o.stop(t+.22); nz({dur:.05,type:'highpass',f:3000,v:.1,when}); }

function crowdVowel_syn(kind,level=1,dur=1.4,fall=true){ const c=ac(); if(!c||!sfxOn())return; const t=c.currentTime; const F=kind==='oh'?[430,780]:kind==='aw'?[650,1000]:[820,1300];
  const g=c.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.1*level,t+.22); g.gain.setValueAtTime(.1*level,t+dur*.55); g.gain.exponentialRampToValueAtTime(.0001,t+dur); g.connect(out());

function crowdBed_syn(on){ const c=ac(); if(!c) return; if(on&&!BED&&sfxOn()){ const s=c.createBufferSource(); s.buffer=noiseBuf(); s.loop=true; const f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=650; f.Q.value=.6; const g=c.createGain(); g.gain.value=.05; const l=c.createOscillator(); l.frequency.value=.21; const lg=c.createGain(); lg.gain.value=.018; l.connect(lg); lg.connect(g.gain); s.connect(f); f.connect(g); g.connect(out()); s.start(); l.start(); BED={s,l}; } if(!on&&BED){ try{BED.s.stop(); BED.l.stop();}catch(e){} BED=null; } }

const SB={}; let sndLoading=false;
function loadSamples(){ const c=ac(); if(!c||sndLoading) return; sndLoading=true;
  for(const [k,u] of Object.entries(SND)){ fetch(u).then(r=>{ if(!r.ok) throw 0; return r.arrayBuffer(); }).then(b=>new Promise((res,rej)=>c.decodeAudioData(b,res,rej))).then(buf=>{ SB[k]=buf; }).catch(()=>{}); } }
function playS(k,vol=1,rate=1,loop=false){ const c=ac(); if(!c||!sfxOn()||!SB[k]) return null;
  try{ const s=c.createBufferSource(); s.buffer=SB[k]; s.playbackRate.value=rate; s.loop=loop; const g=c.createGain(); g.gain.value=vol; s.connect(g); g.connect(out()); s.start(); return {s,g}; }catch(e){ return null; } }
let lastCrowd=0;
function crowdOnce(k,vol){ const now=performance.now(); if(now-lastCrowd<350) return true; lastCrowd=now; return !!playS(k,vol); }
function whistle(){ if(!playS('whistle',.55)) whistle_syn(); }
function hit(p=1){ if(!playS(Math.random()<.6?'hit':'hit2',Math.min(1,.5+p*.3),.92+Math.random()*.16)) hit_syn(p); }
const boot=()=>{ if(!playS('kick',.9)) boot_syn(); };
function roar(level=1,dur=2){ G.cheerUntil=performance.now()+Math.max(1500,dur*1000);
  const k= (level>=1.3||dur>=3)?'roar' : level>=.85?'bigplay':'cheer';
  if(!crowdOnce(k,Math.min(1,.45+level*.35))) roar_syn(level,dur); }
function crowdVowel(kind,level=1,dur=1.4,fall=true){ if(SB.cheer){ if(kind==='ah') crowdOnce('cheer',.3*level); else crowdOnce('groan',.6*level); return; } crowdVowel_syn(kind,level,dur,fall); }
const ooh=()=>{ if(!crowdOnce('groan',.55)) ooh_syn(); };

function crowdBed(on){ if(!on){ if(BEDS){ try{BEDS.s.stop()}catch(e){} BEDS=null; } return; }

function chip(seq,bpm=150,type='square',v=.07){ const beat=60/bpm; let t=0; for(const [n,len] of seq){ if(n) osc({f:NOTE(n),dur:len*beat*.9,type,v,a:.004,when:t}); t+=len*beat; } return t; }
function fanfare(){ // touchdown: original 8-bit stinger
  chip([[67,.25],[72,.25],[76,.25],[79,.5],[76,.25],[79,1.25]],170,'square',.06);
  chip([[64,.25],[67,.25],[72,.25],[76,.5],[72,.25],[76,1.25]],170,'square',.035);
  chip([[48,.75],[43,.25],[48,1.5]],170,'triangle',.16); }
function winJingle(){ chip([[72,.25],[72,.25],[72,.25],[72,.75],[68,.75],[70,.75],[72,.5],[70,.25],[72,1.5]],180,'square',.06); chip([[48,1],[44,1],[46,1],[48,1.5]],180,'triangle',.16); }
function loseJingle(){ chip([[67,.5],[66,.5],[65,.5],[64,1.5]],120,'square',.05); chip([[43,1.5],[40,1.5]],120,'triangle',.14); }

/* ---- menu theme: original 8-bit "Sunday broadcast" march, loops quietly ---- */
const MUS={on:false,timer:null,next:0,ev:[],len:0};
(function buildTheme(){
  const B=60/138, ev=[]; let t=0;
  const lead=[
    [[74,.75],[69,.25],[74,.5],[78,1],[76,.5],[74,1]],
    [[77,.75],[74,.25],[70,.5],[77,1],[79,.5],[77,1]],
    [[79,.75],[76,.25],[72,.5],[79,.5],[81,.5],[79,.5],[76,1]],
    [[78,1.5],[81,.5],[86,2]],
    [[74,.75],[69,.25],[74,.5],[78,1],[76,.5],[74,1]],
    [[77,.75],[74,.25],[70,.5],[77,1],[79,.5],[77,1]],
    [[79,.5],[81,.5],[84,1],[83,.5],[81,.5],[79,1]],
    [[81,2],[0,.5],[69,.5],[73,.5],[76,.5]]];
  const roots=[38,34,36,38,38,34,36,33];
  const chords={38:[62,66,69],34:[58,62,65],36:[60,64,67],33:[57,61,64]};
  for(let bar=0;bar<8;bar++){
    const b0=bar*4*B; let lt=b0;
    for(const [n,d] of lead[bar]){ if(n) ev.push({t:lt,f:NOTE(n),d:d*B*.92,type:'square',v:.035}); lt+=d*B; }
    const r=roots[bar];
    [r,r,r+12,r,r,r+7,r+12,r].forEach((n,i)=>ev.push({t:b0+i*.5*B,f:NOTE(n),d:.45*B,type:'triangle',v:.11}));
    for(const st of [0,2]) for(const n of chords[r]) ev.push({t:b0+st*B,f:NOTE(n),d:.9*B,type:'square',v:.012});
    for(let i=0;i<8;i++) ev.push({t:b0+i*.5*B,dr:'hat'});
    ev.push({t:b0,dr:'kick'},{t:b0+2*B,dr:'kick'},{t:b0+B,dr:'snare'},{t:b0+3*B,dr:'snare'});
    if(bar===7) for(let i=0;i<4;i++) ev.push({t:b0+3*B+i*.25*B,dr:'snare'});
  }
  MUS.ev=ev.sort((a,b)=>a.t-b.t); MUS.len=32*B;
})();
function musicTick(){ const c=ac(); if(!c||!MUS.on) return; if(!sfxOn()){ return; }
  const now=c.currentTime, ahead=now+.6;
  while(MUS.next<ahead){ const loopStart=MUS.next;
    // schedule the events that fall in [MUS.next, MUS.next+chunk)
    const chunkEnd=Math.min(ahead, MUS.base+MUS.len*(MUS.loop+1));
    for(const e of MUS.ev){ const at=MUS.base+MUS.len*MUS.loop+e.t; if(at<loopStart||at>=chunkEnd) continue; const w=Math.max(0,at-now);
      if(e.dr==='kick') osc({f:110,f2:45,dur:.14,v:.14,when:w}); else if(e.dr==='snare') nz({dur:.1,type:'highpass',f:1800,v:.05,a:.002,when:w}); else if(e.dr==='hat') nz({dur:.025,type:'highpass',f:7000,v:.018,a:.001,when:w});
      else osc({f:e.f,dur:e.d,type:e.type,v:e.v,a:.006,when:w}); }
    MUS.next=chunkEnd; if(MUS.next>=MUS.base+MUS.len*(MUS.loop+1)) MUS.loop++;
  } }
function musicStart(){ const c=ac(); if(!c||MUS.on) return; MUS.on=true; MUS.base=c.currentTime+.15; MUS.next=MUS.base; MUS.loop=0; MUS.timer=setInterval(musicTick,150); musicTick(); }
function musicStop(){ MUS.on=false; clearInterval(MUS.timer); }

/* =========================================================
   PROBLEMS
   ========================================================= */
function pAdd(max){const a=r(1,max-1), b=r(1,max-a); return {text:`${a} + ${b}`, say:`What is ${a} plus ${b}?`, answer:a+b, key:`${a}+${b}`, vis:{k:'add',a,b}}}
function pAdd2(){const a=r(11,29), b=r(2,9); return {text:`${a} + ${b}`, say:`What is ${a} plus ${b}?`, answer:a+b, key:`${a}+${b}`, vis:{k:'up',a,b}}}
function pSub(max){const a=r(max>=20?10:3,max), b=r(1,a-1); return {text:`${a} − ${b}`, say:`What is ${a} minus ${b}?`, answer:a-b, key:`${a}-${b}`, vis:{k:'sub',a,b}}}
function pSub2(){const a=r(21,49), b=r(2,9); return {text:`${a} − ${b}`, say:`What is ${a} minus ${b}?`, answer:a-b, key:`${a}-${b}`, vis:{k:'sub2',a,b}}}
function pMul(tables,maxB=10,minB=2){const t=pick(tables), b=r(minB,maxB); const [x,y]=Math.random()<.5?[t,b]:[b,t]; return {text:`${x} × ${y}`, say:`What is ${x} times ${y}?`, answer:x*y, key:`${x}x${y}`, vis:{k:'mul',a:x,b:y}}}
function pDiv(tables,maxQ=10){const t=pick(tables), q=r(2,maxQ), a=t*q; return {text:`${a} ÷ ${t}`, say:`What is ${a} divided by ${t}? Share ${a} footballs with ${t} players.`, answer:q, key:`${a}/${t}`, vis:{k:'div',a,b:t}}}
const TAGS=[['+ to 10','+ − to 20','× 2, 5, 10'],['+ − to 20','big + − • ×2,5,10','×3, 4, 6 • ÷'],['big + − • ×2,5,10','×3, 4 • ÷','×6–9 • ÷']];
const any=(...fs)=>()=>pick(fs)();
/* Each level: [easy=RUN, medium=PASS, hard=DEEP BOMB]. Bigger play = harder math. */
const GEN={
  easy:  [ ()=>pAdd(10),                          any(()=>pAdd(20),()=>pSub(20)),                 any(()=>pMul([2,5,10]),()=>pAdd2(),()=>pSub2()) ],
  medium:[ any(()=>pAdd(20),()=>pSub(20)),        any(()=>pAdd2(),()=>pSub2(),()=>pMul([2,5,10])), any(()=>pMul([3,4,6],10,3),()=>pDiv([2,5,10])) ],
  hard:  [ any(()=>pMul([2,5,10]),()=>pAdd2()),   any(()=>pMul([3,4],10,3),()=>pDiv([2,5,10])),         any(()=>pMul([6,7,8,9],10,3),()=>pDiv([3,4,6,7,8,9])) ],
};
/* treat 3×4 and 4×3 (or 2+5 and 5+2) as the same fact */
const norm=k=>{ if(!k) return ''; const m=k.match(/^(\d+)([+x])(\d+)$/); return m?[+m[1],+m[3]].sort((a,b)=>a-b).join(m[2]):k; };
function gen(diff){
  G.n=(G.n||0)+1; const recent=G.recent||(G.recent=[]);
  // missed facts come back, but only after at least 4 other problems
  const pool=(G.redo[diff]||[]).filter(x=>G.n-(x.missN||0)>=4 && !recent.includes(norm(x.key)));
  let p;
  if(pool.length && Math.random()<.4) p={...pick(pool)};
  else { let tries=0; do{ p=GEN[diff][G.level](); tries++; }while(recent.includes(norm(p.key)) && tries<30); p.diff=diff; }
  recent.push(norm(p.key)); if(recent.length>12) recent.shift();
  return p;
}
function dots(n,cls=''){return Array.from({length:n},()=>`<div class="dot ${cls}"></div>`).join('')}
function hintHTML(p){
  const v=p.vis; if(!v) return '';
  if(v.k==='add') return `<div class="hint"><div class="grp">${dots(v.a)}</div><div class="htext" style="align-self:center">+</div><div class="grp">${dots(v.b,'s')}</div></div><div class="htext">Count them all: ${v.a+v.b}</div>`;
  if(v.k==='up'){const steps=Array.from({length:v.b},(_,i)=>v.a+i+1).join(', '); return `<div class="htext">Start at <b>${v.a}</b> and count up ${v.b}:<br>${steps}</div>`}
  if(v.k==='sub') return `<div class="hint"><div class="grp" style="max-width:260px">${dots(v.a-v.b)}${dots(v.b,'x')}</div></div><div class="htext">Take away ${v.b}, count what's left: ${v.a-v.b}</div>`;
  if(v.k==='sub2') return `<div class="htext">Start at <b>${v.a}</b> and count back ${v.b}:<br>${Array.from({length:v.b},(_,i)=>v.a-i-1).join(', ')}</div>`;
  if(v.k==='mul'){ if(v.a*v.b>100) return `<div class="htext">${v.a} groups of ${v.b}</div>`; return `<div class="hint">${Array.from({length:v.a},()=>`<div class="grp">${dots(v.b)}</div>`).join('')}</div><div class="htext">${v.a} groups of ${v.b} = ${v.a*v.b}</div>`}
  if(v.k==='div'){const q=v.a/v.b; return `<div class="hint">${Array.from({length:v.b},()=>`<div class="grp">${dots(q)}</div>`).join('')}</div><div class="htext">${v.a} shared into ${v.b} groups = ${q} each</div>`}
  return '';
}

/* ---------- win probability (simple, kid-readable) ---------- */
function winProb(){
  const diff=G.home-G.away, total=G.qLen*4, el=Math.min(1,((G.q-1)*G.qLen+(G.qLen-G.clock))/total);

  return Math.round(Math.max(3,Math.min(97,p)));

async function setFormation(offSide,losPos,kind='normal',dur=650){
  const d=offSide==='home'?1:-1, X0=10+losPos;
  const op=kind==='kick'?KICK_POS:kind==='punt'?PUNT_POS:OFF_POS;
  const dp=kind==='kick'?DEF_KICK:kind==='punt'?DEF_PUNT:(offSide==='home'&&G.look&&typeof LOOK_POS!=='undefined'&&LOOK_POS[G.look])?LOOK_POS[G.look]:DEF_POS;
  const first=!ACT.length;
  if(first){ for(const s of ['home','away']) for(let i=0;i<11;i++) ACT.push({side:s,i,x:0,y:MIDY,face:0,kf:null}); }
  let maxD=0;
  ACT.forEach(a=>{ const isOff=a.side===offSide; a.role=isOff?OFF_ROLES[a.i]:DEF_ROLES[a.i];
    const [dx,dy]=(isOff?op:dp)[a.role]; a.tx=clampX(X0+d*dx); a.ty=clampY(MIDY+dy);
    a.baseFace=isOff?(d>0?0:Math.PI):(d>0?Math.PI:0); a.jump=false;
    if(first){a.x=a.tx;a.y=a.ty;a.face=a.baseFace;}
    maxD=Math.max(maxD,Math.hypot(a.x-a.tx,a.y-a.ty)); });
  G.offSide=offSide; G.dir=d;
  const b=ballAt(1);
  if(first||maxD<.3||dur===0){ ACT.forEach(a=>{a.x=a.tx;a.y=a.ty;a.face=a.baseFace;a.kf=null}); BALL.segs=[{t0:0,t1:1,type:'ground',x:X0,y:MIDY}]; return; }
  BALL.segs=[{t0:0,t1:1,type:'fly',x0:b.x,y0:b.y,x1:X0,y1:MIDY,h:1.2}];
  ACT.forEach(a=>{a.kf=[[0,a.x,a.y],[1,a.tx,a.ty]]});
  await runAnim(dur);
  ACT.forEach(a=>a.face=a.baseFace);
}

function runAnim(dur,events=[]){ return new Promise(res=>{ ANIM={start:performance.now(),dur,t:0,events:events.map(e=>({...e,done:false})),res}; }); }
function kfAt(kf,t){ if(t<=kf[0][0]) return {x:kf[0][1],y:kf[0][2]}; for(let i=0;i<kf.length-1;i++){ if(t<=kf[i+1][0]){ const span=(kf[i+1][0]-kf[i][0])||1, u=(t-kf[i][0])/span; return {x:lerp(kf[i][1],kf[i+1][1],u), y:lerp(kf[i][2],kf[i+1][2],u)}; } } const l=kf[kf.length-1]; return {x:l[1],y:l[2]}; }
function ballAt(t){
  const segs=BALL.segs; if(!segs||!segs.length) return {x:60,y:MIDY,h:0};
  let s=segs.find(s=>t>=s.t0&&t<=s.t1)||segs[segs.length-1];
  if(s.type==='hold'){ const a=s.a; return {x:a.x+Math.cos(a.face)*.45, y:a.y+Math.sin(a.face)*.45, h:.4, holder:a}; }
  if(s.type==='fly'){ const u=Math.max(0,Math.min(1,(t-s.t0)/((s.t1-s.t0)||1))); return {x:lerp(s.x0,s.x1,u), y:lerp(s.y0,s.y1,u), h:4*s.h*u*(1-u), fly:true}; }
  return {x:s.x,y:s.y,h:0};
}
const lerpAngle=(a,b,t)=>{let d=((b-a+Math.PI*3)%(Math.PI*2))-Math.PI; return a+d*t;};
function addFX(x,y,text,kind='boom'){FX.push({x,y,text,kind,t0:performance.now(),dur:kind==='boom'?700:1300});}

function frame(now){
  requestAnimationFrame(frame);
  const cv=document.getElementById('cv'); if(!cv) return;
  if(ANIM){
    const t=Math.min(1,(now-ANIM.start)/ANIM.dur); ANIM.t=t;
    ACT.forEach(a=>{ if(!a.kf) return; const p=kfAt(a.kf,t); const dx=p.x-a.x, dy=p.y-a.y; if(Math.hypot(dx,dy)>.015) a.face=lerpAngle(a.face,Math.atan2(dy,dx),.25); a.x=p.x; a.y=p.y; });
    ANIM.events.forEach(e=>{ if(!e.done&&t>=e.t){e.done=true; try{e.fn()}catch(err){}} });
    if(t>=1){ const res=ANIM.res; const b=ballAt(1); const last=BALL.segs[BALL.segs.length-1];
      BALL.segs = (last&&last.type==='hold')?[{t0:0,t1:1,type:'hold',a:last.a}]:[{t0:0,t1:1,type:'ground',x:b.x,y:b.y}];
      ACT.forEach(a=>a.kf=null); ANIM=null; setTimeout(res,220); }
  }
  draw(cv,now);
}

function draw(cv,now){
  const dpr=Math.min(2,window.devicePixelRatio||1), W=cv.clientWidth, H=cv.clientHeight;
  if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);}
  const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  const home=T(), away=O();
  const standH=H*.2, fTop=standH, fBot=H+H*.04;
  const Y0w=-2.5, Y1w=FW+2.5;
  const viewNear=W<600?34:52, Sn=W/viewNear, Sf=Sn*.58;
  const dep=y=>(y-Y0w)/(Y1w-Y0w), S=y=>Sf+(Sn-Sf)*dep(y), Y=y=>fTop+dep(y)*(fBot-fTop);
  const Vy=(fBot-fTop)/(Y1w-Y0w);
  const b=ballAt(ANIM?ANIM.t:1);
  let tx=b.x+G.dir*(ANIM?3:9);
  tx=Math.max(viewNear/2-8,Math.min(128-viewNear/2,tx));
  if(!cam.init){cam.x=tx;cam.init=true;}
  cam.x+=(tx-cam.x)*(ANIM?.08:.05);
  const X=(x,y)=>W/2+(x-cam.x)*S(y);
  const quad=(x0,x1,y0,y1,fill)=>{ ctx.beginPath(); ctx.moveTo(X(x0,y0),Y(y0)); ctx.lineTo(X(x1,y0),Y(y0)); ctx.lineTo(X(x1,y1),Y(y1)); ctx.lineTo(X(x0,y1),Y(y1)); ctx.closePath(); ctx.fillStyle=fill; ctx.fill(); };
  const line=(x0,y0,x1,y1)=>{ ctx.beginPath(); ctx.moveTo(X(x0,y0),Y(y0)); ctx.lineTo(X(x1,y1),Y(y1)); ctx.stroke(); };
  // night sky + stands
  ctx.fillStyle='#070b14'; ctx.fillRect(0,0,W,H);
  const g=ctx.createLinearGradient(0,0,0,standH); g.addColorStop(0,'#0b1220'); g.addColorStop(1,'#141b28'); ctx.fillStyle=g; ctx.fillRect(0,0,W,standH+2);
  const cheering=G.cheerUntil>now, span=W*1.8, off=(cam.x*Sf*.6)%span;
  for(const c of CROWD){
    let px=c.u*span-off; if(px<-span*.2) px+=span; if(px>W+4) continue;
    const py=standH*.18+c.v*standH*.8, bob=cheering?Math.abs(Math.sin(now/90+c.p))*3:0, s=1.6+c.v*1.6;
    ctx.fillStyle=c.c; ctx.globalAlpha=.55+c.v*.4; ctx.fillRect(px,py-bob,s,s*1.3);
  }
  ctx.globalAlpha=1;
  for(const lx of [.12,.38,.62,.88]){ const gx=W*lx, gl=ctx.createRadialGradient(gx,4,0,gx,4,W*.22); gl.addColorStop(0,'rgba(210,228,255,.35)'); gl.addColorStop(1,'rgba(210,228,255,0)'); ctx.fillStyle=gl; ctx.fillRect(0,0,W,H*.55); ctx.fillStyle='#f4f8ff'; ctx.fillRect(gx-14,2,28,5); }
  // wall
  ctx.fillStyle='#10213a'; ctx.fillRect(0,standH-4,W,6);
  // turf
  quad(-12,132,Y0w,Y1w,'#1e5226');
  for(let x=10;x<110;x+=10) quad(x,x+5,-1,FW+1,'#1b4a22');
  quad(0,10,0,FW,home.c1); quad(110,120,0,FW,away.c1);
  // end zone names
  for(const [cx,t,rot] of [[5,home,-1],[115,away,1]]){
    const sx=X(cx,MIDY), sy=Y(MIDY), sc=S(MIDY);
    if(sx<-200||sx>W+200) continue;
    ctx.save(); ctx.translate(sx,sy); ctx.scale(1,Vy/sc*1.6); ctx.rotate(rot*Math.PI/2);
    ctx.font=`900 ${3.6*sc}px 'Saira Condensed', sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle=(t.c2==='#000000'||t.c2===t.c1)?'#ffffff':t.c2; ctx.fillText(t.name.toUpperCase(),0,0); ctx.restore();
  }
  // lines
  ctx.strokeStyle='rgba(255,255,255,.85)';
  for(let x=10;x<=110;x+=5){ ctx.lineWidth=(x===10||x===110)?2.4:1.3; line(x,0,x,FW); }
  ctx.lineWidth=2.4; line(0,0,120,0); line(0,FW,120,FW); line(0,0,0,FW); line(120,0,120,FW);
  ctx.lineWidth=1; ctx.strokeStyle='rgba(255,255,255,.6)';
  for(let x=11;x<110;x++){ if((x-10)%5===0)continue; for(const hy of [.7,23.58,29.73,FW-.7]) line(x,hy-.35,x,hy+.35); }
  // numbers
  ctx.fillStyle='rgba(255,255,255,.78)'; ctx.textAlign='center'; ctx.textBaseline='middle';
  for(let yd=10;yd<=90;yd+=10){ const n=yd<=50?yd:100-yd;
    for(const ny of [FW-8.5,8.5]){ const sc=S(ny), px=X(10+yd,ny); if(px<-60||px>W+60) continue;
      ctx.save(); ctx.translate(px,Y(ny)); ctx.scale(1,Vy/sc*1.5); ctx.font=`800 ${2.4*sc}px 'Saira Condensed', sans-serif`; ctx.fillText(n,0,0); ctx.restore(); } }
  // midfield logo
  { const sc=S(MIDY); ctx.beginPath(); ctx.ellipse(X(60,MIDY),Y(MIDY),3.8*sc,3.8*Vy,0,0,6.29); ctx.fillStyle=home.c1; ctx.globalAlpha=.85; ctx.fill(); ctx.globalAlpha=1; ctx.lineWidth=2; ctx.strokeStyle=home.c2; ctx.stroke();
    ctx.save(); ctx.translate(X(60,MIDY),Y(MIDY)); ctx.scale(1,Vy/sc*1.4); ctx.font=`900 ${2.2*sc}px 'Saira Condensed', sans-serif`; ctx.fillStyle=(home.c2==='#000000')?'#fff':home.c2; ctx.fillText(home.abbr,0,0); ctx.restore(); }
  // scrimmage + first down (glow)
  if(!ANIM && G.lines && G.offSide==='home'){
    ctx.save(); ctx.shadowBlur=12; ctx.lineWidth=4;
    ctx.shadowColor=ctx.strokeStyle='#3fa9f5'; line(10+G.pos,0,10+G.pos,FW);
    if(100-G.pos>G.toGo){ ctx.shadowColor=ctx.strokeStyle='#ffd23f'; line(10+G.pos+G.toGo,0,10+G.pos+G.toGo,FW); }
    ctx.restore();
  }
  // goal posts (far end of each end zone, standing up)
  for(const gx of [0,120]){ const px=X(gx,MIDY); if(px<-80||px>W+80) continue; const sc=S(MIDY), base=Y(MIDY), cb=base-3*sc;
    ctx.strokeStyle='#ffd23f'; ctx.lineWidth=Math.max(2,.35*sc); ctx.beginPath(); ctx.moveTo(px,base); ctx.lineTo(px,cb);
    ctx.moveTo(X(gx,MIDY-3.08),cb); ctx.lineTo(X(gx,MIDY+3.08),cb); ctx.moveTo(X(gx,MIDY-3.08),cb); ctx.lineTo(X(gx,MIDY-3.08),cb-6*sc); ctx.moveTo(X(gx,MIDY+3.08),cb); ctx.lineTo(X(gx,MIDY+3.08),cb-6*sc); ctx.stroke(); }
  // players (far first)
  const holder=b.holder;
  [...ACT].sort((p,q)=>p.y-q.y).forEach(a=>{ const px=X(a.x,a.y); if(px<-60||px>W+60) return; drawPlayer(ctx,a,px,Y(a.y),S(a.y),now,a===holder); });
  // ball
  { const sc=S(b.y), bx=X(b.x,b.y), by=Y(b.y);
    if(!holder||b.fly){ ctx.fillStyle='rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(bx,by,.35*sc,.12*sc,0,0,6.29); ctx.fill(); }
    if(!holder||b.fly){ const lift=(b.h*.9+(b.fly?0:.15))*sc, s2=1+b.h*.04;
      ctx.save(); ctx.translate(bx,by-lift); ctx.rotate(b.fly?(G.dir>0?-.25:.25)+Math.sin(now/50)*.15:0);
      ctx.fillStyle='#8b4a1c'; ctx.strokeStyle='#3d1c06'; ctx.lineWidth=1; ctx.beginPath(); ctx.ellipse(0,0,.42*sc*s2,.25*sc*s2,0,0,6.29); ctx.fill(); ctx.stroke();
      ctx.strokeStyle='#fff'; ctx.beginPath(); ctx.moveTo(-.14*sc,0); ctx.lineTo(.14*sc,0); ctx.stroke(); ctx.restore(); } }
  // fx
  FX=FX.filter(f=>now-f.t0<f.dur);
  for(const f of FX){ const age=(now-f.t0)/f.dur, sc=S(f.y), px=X(f.x,f.y), py=Y(f.y);
    if(f.kind==='boom'){ ctx.strokeStyle=`rgba(255,255,255,${1-age})`; ctx.lineWidth=3; ctx.beginPath(); ctx.ellipse(px,py-sc*.8,(.6+age*2.4)*sc,(.6+age*2.4)*sc*.5,0,0,6.29); ctx.stroke(); }
    if(f.text){ ctx.save(); ctx.globalAlpha=1-Math.max(0,age-.6)/.4; ctx.font=`900 ${Math.max(18,2.2*sc)}px 'Saira Condensed', sans-serif`; ctx.textAlign='center'; ctx.lineWidth=5; ctx.strokeStyle='#000'; const yy=py-sc*3.2-age*sc*1.5; ctx.strokeText(f.text,px,yy); ctx.fillStyle='#ffd23f'; ctx.fillText(f.text,px,yy); ctx.restore(); }
  }
}
function drawPlayer(ctx,a,px,py,u,now,isHolder){
  const t=TEAMS[a.side==='home'?G.homeT:G.awayT], home=a.side==='home';
  const jersey=home?t.c1:'#f4f4f4', numc=home?((t.c2==='#000000'||t.c2===t.c1)?'#ffffff':t.c2):t.c1, pants=home?(t.h===t.c1?'#e9e9e9':t.h):'#e3e3e3';
  const moving=Math.hypot(a.x-(a.lx??a.x),a.y-(a.ly??a.y))>.01; a.lx=a.x; a.ly=a.y;
  const dir=Math.cos(a.face)>=0?1:-1;
  let lift=0; if(a.jump) lift=Math.abs(Math.sin(now/120+a.i))*u*.9;
  const stride=moving?Math.sin(now/70+a.i)*u*.18:0;
  // shadow + carrier ring
  if(isHolder){ ctx.save(); ctx.shadowBlur=10; ctx.shadowColor='#ffd23f'; ctx.strokeStyle='rgba(255,210,63,.9)'; ctx.lineWidth=2; ctx.beginPath(); ctx.ellipse(px,py,.9*u,.32*u,0,0,6.29); ctx.stroke(); ctx.restore(); }
  ctx.fillStyle='rgba(0,0,0,.38)'; ctx.beginPath(); ctx.ellipse(px+.2*u,py,.62*u,.2*u,0,0,6.29); ctx.fill();
  const by=py-lift;
  // legs
  ctx.fillStyle=pants; ctx.fillRect(px-.3*u+stride,by-.95*u,.24*u,.95*u); ctx.fillRect(px+.06*u-stride,by-.95*u,.24*u,.95*u);
  ctx.fillStyle='#111'; ctx.fillRect(px-.32*u+stride,by-.12*u,.28*u,.12*u); ctx.fillRect(px+.04*u-stride,by-.12*u,.28*u,.12*u);
  // torso
  const tw=1.0*u, th=.95*u, tx=px-tw/2, ty=by-.95*u-th;
  ctx.fillStyle=jersey; ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(tx,ty,tw,th,.22*u); else ctx.rect(tx,ty,tw,th); ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.35)'; ctx.lineWidth=1; ctx.stroke();
  if(u>7){ ctx.fillStyle=numc; ctx.font=`900 ${.62*u}px 'Saira Condensed', sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(jerseyNum(a),px,ty+th*.52); }
  // helmet
  const hx=px+dir*.06*u, hy=ty-.3*u;
  ctx.fillStyle=t.h; ctx.beginPath(); ctx.arc(hx,hy,.38*u,0,6.29); ctx.fill(); ctx.strokeStyle='rgba(0,0,0,.4)'; ctx.stroke();
  ctx.strokeStyle=(t.h===t.c2?t.c1:t.c2); ctx.lineWidth=Math.max(1,.1*u); ctx.beginPath(); ctx.arc(hx,hy,.27*u,Math.PI*1.15,Math.PI*1.85); ctx.stroke();
  ctx.strokeStyle='#cfcfcf'; ctx.lineWidth=Math.max(1,.08*u); ctx.beginPath(); ctx.moveTo(hx+dir*.22*u,hy-.05*u); ctx.lineTo(hx+dir*.44*u,hy+.02*u); ctx.lineTo(hx+dir*.36*u,hy+.26*u); ctx.stroke();
}

/* =========================================================
   PLAY ANIMATIONS
   spec.kind: run | pass | bomb | inc | int | sack | fg | punt
   ========================================================= */
async function animPlay(side,losPos,spec){
  const form=spec.kind==='fg'?'kick':spec.kind==='punt'?'punt':'normal';
  await setFormation(side,losPos,form);
  await wait(250);
  const d=side==='home'?1:-1, X0=10+losPos, Y0=MIDY, offS=side, defS=side==='home'?'away':'home';
  const Of=ro=>actor(offS,ro), Df=ro=>actor(defS,ro);
  ACT.forEach(a=>a.kf=[[0,a.x,a.y]]);
  const K=(a,t,x,y)=>{ const l=a.kf[a.kf.length-1]; a.kf.push([Math.max(t,l[0]+.001),clampX(x),clampY(y)]); };
  const kind=spec.kind, g=spec.gain||0, td=!!spec.td;
  const ezX=side==='home'?113:7, endX=td?ezX:X0+d*g;
  const QB=Of('QB'), RB=Of('RB');
  let E, segs, ev=[{t:.06,fn:hut}], dur=2700, out={};
  const happy=side==='home'; // home crowd cheers when the home team does well
  const nearestDef=y=>['CB1','CB2','S1','S2'].map(Df).sort((p,q)=>Math.abs(p.y-y)-Math.abs(q.y-y))[0];

  if(kind==='run'){
    const cut=pick([-2.4,2.4,-1.2,1.2]), short=!td&&g<=2, tE=td?.95:short?.58:.88;
    const hx=QB.x-d*.4;
    K(QB,.1,QB.x,QB.y); K(QB,.2,hx,Y0+(cut>0?-.6:.6)); K(QB,.55,hx-d*1.5,Y0+(cut>0?-2:2));
    K(RB,.1,RB.x,RB.y); K(RB,.21,hx,Y0+(cut>0?.7:-.7)); K(RB,.4,X0+d*.8,Y0+cut);
    const ey=clampY(Y0+cut+r(-3,3)); K(RB,tE,endX,ey); if(!td) K(RB,Math.min(1,tE+.08),endX+d*.6,ey);
    segs=[{t0:0,t1:.2,type:'hold',a:QB},{t0:.2,t1:1,type:'hold',a:RB}];
    const Tk=Df(short?pick(['DT1','DT2']):'MLB'); K(Tk,.12,Tk.x,Tk.y); K(Tk,tE,td?endX-d*4:endX+d*.9,ey+(td?2:.4));
    E={x:endX,y:ey,t:tE}; out.carrier=RB;
    ev.push({t:.21,fn:()=>nz({dur:.05,type:'bandpass',f:900,q:2,v:.2,a:.002})});
    if(!short) ev.push({t:.45,fn:()=> happy? roar(g>=10||td?1.15:.65,1.9) : (g>=10?ooh():null)});
    if(!td) ev.push({t:tE,fn:()=>{hit(short?1.35:.9+g/25); addFX(endX,ey,short?'STUFFED':''); if(short){ happy?aww():roar(1,1.6); }}});
    dur=short?2200:2700;
  }
  else if(kind==='pass'||kind==='bomb'||kind==='inc'||kind==='int'){
    const bomb=kind==='bomb'||spec.deep, drop=bomb?5:3, thT=.36, cT=bomb?.72:.6;
    K(QB,.1,QB.x,QB.y); K(QB,.32,QB.x-d*drop,Y0); const qx=QB.x-d*drop;
    const W=Of(spec.target||pick(bomb?['WR1','WR2']:['WR1','WR2','WR3','TE']));
    let cd; if(kind==='inc'||kind==='int') cd=bomb?r(18,28):r(8,13); else { const yac=td?r(0,3):bomb?r(2,5):r(1,3); cd=Math.max(3,g-yac); }
    cd=Math.min(cd,Math.abs((side==='home'?118:2)-X0));
    const cx=X0+d*cd, cy=clampY(W.y+(Y0-W.y)*.4+r(-2,2));
    K(W,.1,W.x,W.y); K(W,cT,cx,cy);
    const Cv=nearestDef(W.y); K(Cv,.1,Cv.x,Cv.y);
    const fh=bomb?9:3.5;
    if(kind==='inc'){
      const lx=cx+d*2.5, ly=clampY(cy+pick([-2,2]));
      K(W,cT+.12,cx+d*2.5,cy); K(Cv,cT,cx+d*.8,cy+.8); K(Cv,cT+.12,cx+d*1.6,cy+1.2);
      segs=[{t0:0,t1:thT,type:'hold',a:QB},{t0:thT,t1:cT+.04,type:'fly',x0:qx,y0:Y0,x1:lx,y1:ly,h:fh},{t0:cT+.04,t1:1,type:'ground',x:lx,y:ly}];
      E={x:cx,y:cy,t:cT}; ev.push({t:thT,fn:()=>whoosh(bomb?.6:.3)}); ev.push({t:cT,fn:()=>{addFX(cx,cy,'NO GOOD','text'); thwack(); happy?aww():roar(1,1.6);}}); dur=bomb?2900:2500;
    } else if(kind==='int'){
      const ix=cx-d*1, iy=cy; K(Cv,cT,ix,iy); const rx=ix-d*12, ry=clampY(iy+r(-4,4)); K(Cv,.95,rx,ry);
      K(W,cT+.1,cx,cy); K(W,.95,rx+d*1.3,ry+.5);
      segs=[{t0:0,t1:thT,type:'hold',a:QB},{t0:thT,t1:cT,type:'fly',x0:qx,y0:Y0,x1:ix,y1:iy,h:fh},{t0:cT,t1:1,type:'hold',a:Cv}];
      E={x:rx,y:ry,t:.95}; out.carrier=Cv; out.intPos=rx-10;
      ev.push({t:thT,fn:()=>whoosh(.4)}); ev.push({t:cT,fn:()=>{thwack(); if(happy) aww(); else {roar(1.4,2.6); horn();} addFX(ix,iy,'PICKED!','text');}}); ev.push({t:.95,fn:()=>hit(1.1)}); dur=3300;
    } else {
      const ey=clampY(cy+r(-3,3)); K(W,.93,endX,ey); if(!td) K(W,1,endX+d*.5,ey);
      K(Cv,cT,cx+d*1.6,cy+1.2); K(Cv,.93,td?endX-d*4:endX+d*.9,ey+.5);
      segs=[{t0:0,t1:thT,type:'hold',a:QB},{t0:thT,t1:cT,type:'fly',x0:qx,y0:Y0,x1:cx,y1:cy,h:fh},{t0:cT,t1:1,type:'hold',a:W}];
      E={x:endX,y:ey,t:.93}; out.carrier=W;
      ev.push({t:thT,fn:()=>whoosh(bomb?.65:.3)}); if(bomb&&happy) ev.push({t:thT+.04,fn:()=>crowdVowel('ah',.7,1.3,false)});
      ev.push({t:cT,fn:()=>{thwack(); happy? roar(bomb||td?1.35:.9,2.2) : (bomb?aww():ooh());}}); if(!td) ev.push({t:.93,fn:()=>hit(bomb?1.2:1)});
      dur=bomb?3400:2900;
    }
  }
  else if(kind==='sack'){
    const loss=-g, qd=X0-d*(loss-1), sx=X0-d*loss;
    K(QB,.1,QB.x,QB.y); K(QB,.32,qd,Y0); K(QB,.5,qd,Y0); K(QB,.62,sx,Y0+.5);
    const R=Df(pick(['DE1','DE2'])); K(R,.12,R.x,R.y); K(R,.5,qd+d*.9,Y0+(R.y<Y0?-.6:.6)); K(R,.62,sx+d*.7,Y0);
    segs=[{t0:0,t1:1,type:'hold',a:QB}]; E={x:sx,y:Y0,t:.55}; out.carrier=QB;
    ev.push({t:.52,fn:()=>{hit(1.5); addFX(qd,Y0,'SACK!','text'); happy?aww():roar(1.3,2.2);}}); dur=2300;
  }
  else if(kind==='fg'){
    const H=QB, Kk=RB, hx=H.x;
    K(Kk,.08,Kk.x,Kk.y); K(Kk,.26,hx-d*.6,Y0-.4); K(Kk,.38,hx+d*.8,Y0-.1);
    const postX=side==='home'?120:0, ly=spec.good?Y0+r(-10,10)/10:Y0+pick([-1,1])*r(5,7), landX=postX+d*2.5;
    segs=[{t0:0,t1:.06,type:'ground',x:X0,y:Y0},{t0:.06,t1:.16,type:'fly',x0:X0,y0:Y0,x1:hx,y1:Y0,h:.4},{t0:.16,t1:.27,type:'ground',x:hx+d*.3,y:Y0},{t0:.27,t1:.85,type:'fly',x0:hx+d*.3,y0:Y0,x1:landX,y1:ly,h:13},{t0:.85,t1:1,type:'ground',x:landX,y:ly}];
    E={x:X0,y:Y0,t:.5}; ev=[{t:.06,fn:()=>nz({dur:.05,type:'bandpass',f:900,q:2,v:.2,a:.002})},{t:.27,fn:boot},{t:.8,fn:()=>{ if(spec.good){ if(happy){roar(1.1,2); horn();} else aww(); addFX(postX,MIDY,'GOOD!','text');} else { happy?aww():roar(1,1.6); addFX(postX,MIDY,'NO GOOD','text');} }}];
    dur=Math.max(2600,1800+Math.abs(postX-X0)*30);
  }
  else if(kind==='punt'){
    const P=QB, land=10+spec.land, Rt=Df('S1');
    K(Rt,.1,Rt.x,Rt.y); K(Rt,.85,land,Y0+1); K(Rt,1,land-d*3,Y0+1.5);
    for(const ro of ['WR1','WR2']){ const w=Of(ro); K(w,.1,w.x,w.y); K(w,.88,land-d*3,Y0+(w.y<Y0?-3:3)); }
    segs=[{t0:0,t1:.05,type:'ground',x:X0,y:Y0},{t0:.05,t1:.18,type:'fly',x0:X0,y0:Y0,x1:P.x,y1:Y0,h:.6},{t0:.18,t1:.3,type:'hold',a:P},{t0:.3,t1:.85,type:'fly',x0:P.x+d*.5,y0:Y0,x1:land,y1:Y0+1,h:15},{t0:.85,t1:1,type:'hold',a:Rt}];
    E={x:land,y:Y0,t:.85}; ev=[{t:.3,fn:boot},{t:.98,fn:()=>hit(.7)}]; dur=3300;
  }
  // everyone else
  ACT.forEach(a=>{ if(a.kf.length>1) return; const sx=a.x, sy=a.y, isOff=a.side===offS;
    if(isOff){

};
function lookIcon(k){
  if(k==='blitz') return `<svg width="34" height="26" viewBox="0 0 34 26" aria-hidden="true"><g stroke="#ff9a80" stroke-width="2.5" fill="none" stroke-linecap="round"><path d="M4 4 L14 12 M30 4 L20 12 M17 2 L17 12"/><path d="M14 12 l-4 0 l2 -3 M20 12 l4 0 l-2 -3"/></g><circle cx="17" cy="21" r="3.5" fill="none" stroke="#fff" stroke-width="2"/></svg>`;
  if(k==='box') return `<svg width="34" height="26" viewBox="0 0 34 26" aria-hidden="true"><g font-family="Saira Condensed" font-weight="900" font-size="9" fill="#ffd27a"><text x="3" y="10">X</text><text x="10" y="10">X</text><text x="17" y="10">X</text><text x="24" y="10">X</text><text x="7" y="17">X</text><text x="20" y="17">X</text></g><line x1="2" y1="21" x2="32" y2="21" stroke="#fff" stroke-width="2"/></svg>`;
  return `<svg width="34" height="26" viewBox="0 0 34 26" aria-hidden="true"><g font-family="Saira Condensed" font-weight="900" font-size="9" fill="#8fd0ff"><text x="4" y="8">X</text><text x="24" y="8">X</text><text x="14" y="15">X</text></g><line x1="2" y1="23" x2="32" y2="23" stroke="#fff" stroke-width="2"/></svg>`;
}

function callPlay(){
  if(G.quit) return;
  if(!G.look) G.look=chooseLook();
  updateBoard(); setFormation('home',G.pos);
  const L=LOOKS[G.look], on=O().name;
  const canFG=G.pos>=60, fgDist=100-G.pos+17, fourth=G.down===4, late=!G.ot&&G.clock<=40&&(G.q===2||G.q===4);
  const card=(t,kind,nm,yd,pips)=>`<button class="play" data-t="${t}">${playSVG(kind)}<div class="nm">${nm}</div><div class="yd">${yd}</div><div class="mt">${TAGS[G.level][pips-1]}</div><div class="pips">${[1,2,3].map(i=>`<i class="${i<=pips?'on':''}"></i>`).join('')}</div></button>`;
  setPanel(`
    <div class="look glass" style="border-color:${L.col}">${lookIcon(G.look)}<div><div class="lk">${on.toUpperCase()} SHOW: <span style="color:${L.col}">${L.name}</span></div><div class="tip">${L.tip}</div></div></div>
    <div class="ptitle">${fourth?"4th down — what's the call, Coach?":late?'Clock is running out!':'Call your play'}</div>
    <div class="plays">${card('easy','run','RUN','short gain',1)}${card('medium','pass','PASS','medium gain',2)}${card('hard','bomb','DEEP BOMB','big gain · risky',3)}</div>
    ${(fourth||(late&&canFG))?`<div class="extras">${canFG?`<button class="cta" style="font-size:20px;padding:8px 18px" id="fg">Field goal (${fgDist} yds)</button>`:''}${fourth?'<button class="ghost" id="punt">Punt it away</button>':''}</div>`:''}`,
  ()=>{ $('.plays').onclick=e=>{const b=e.target.closest('.play'); if(b) runPlay(b.dataset.t)}; if($('#fg'))$('#fg').onclick=fieldGoal; if($('#punt'))$('#punt').onclick=punt; });
}
async function runPlay(type){
  const R=RS(G.homeT), look=G.look||'deep', L=LOOKS[look];
  const wrIdx= type==='hard'? pick([0,1]) : pick([0,1,2]);
  const p=gen(type), meta={easy:['RUN','#1f7a3a'],medium:['PASS','#0b5aa6'],hard:['DEEP BOMB','#6b2bb3']}[type];
  const who= type==='easy'? `${last(R.RB[1])} #${R.RB[0]}` : `${last(R.QB[1])} → ${last(R.WR[wrIdx][1])}`;
  
  const goal=100-G.pos<=G.toGo;
  const res=await ask(p,{title:meta[0], color:meta[1], sit:`${ord(G.down).toUpperCase()} & ${goal?'GOAL':G.toGo} · vs ${L.name.toLowerCase()} · ${who}`, clock:G.pclock, burstText:'BEAT THE CLOCK — +5 yard burst!'});
  if(G.quit) return;
  const ok=res.ok, match= type===L.best?'best': type===L.bad?'bad':'ok';
  const old=G.pos;
  // outcome table: right answer + right call = big play; wrong call still moves the ball a little
  let kind, gain=0, note='';
  if(type==='easy'){
    kind='run';
    if(!ok) gain=r(0,2);
    else if(match==='best') gain=r(7,11);
    else if(match==='ok') gain=r(3,6);
    else { gain=r(-1,2); note='stuffed'; }
  } else if(type==='medium'){
    if(!ok){ kind='inc'; }
    else { kind='pass'; gain= match==='best'? r(12,18) : r(7,11); }
  } else {
    if(!ok){ const pick6= look==='deep'? .5 : .3; kind= Math.random()<pick6 ? 'int' : 'inc'; }
    else if(match==='best'){ kind='bomb'; gain=r(26,40); }
    else if(look==='blitz'){ if(Math.random()<.6){ kind='sack'; gain=-r(5,8); } else { kind='bomb'; gain=r(14,22); note='just got it off'; } }
    else { if(Math.random()<.55){ kind='inc'; note='covered'; } else { kind='bomb'; gain=r(14,22); note='contested catch'; } }
  }
  if(res.fast&&(kind==='run'||kind==='pass'||kind==='bomb')){ gain+=5; G.bursts++; }
  if(old+gain>100) gain=100-old;
  if(old+gain<1) gain=1-old;
  const td=(kind==='run'||kind==='pass'||kind==='bomb')&&old+gain>=100;
  waiting(); lower('&nbsp;','info');
  const out=await animPlay('home',old,{kind,gain,td,target:'WR'+(wrIdx+1)});
  if(G.quit) return;
  G.look=null;
  if(kind==='int'){
    runClock(r(6,10));
    lower(`INTERCEPTED! ${O().name} take over`,'bad'); await wait(1500);
    return goTo('defense',Math.max(8,Math.min(92,Math.round(out.intPos||old+15))));
  }
  runClock(kind==='inc'?r(5,8):td?r(8,14):r(24,36));
  G.pos=old+gain; updateBoard();
  const carrierName= kind==='run'? last(R.RB[1]) : last(R.WR[wrIdx][1]);
  if(td) return touchdown(out.carrier, carrierName);
  const QB=last(R.QB[1]), WR=last(R.WR[wrIdx][1]), RB=last(R.RB[1]);
  if(kind==='sack') lower(`${QB} SACKED by the blitz! Loss of ${-gain}`,'bad');
  else if(kind==='inc') lower(note==='covered'?`Deep ball… covered! Incomplete`:`${QB}'s pass falls incomplete`,'bad');
  else if(kind==='run') lower(note==='stuffed'?`${RB} stuffed by the stacked box`:ok&&match==='best'?`Great call! ${RB} breaks loose for ${gain}`:`${RB} for ${gain} yards`, ok&&gain>2?'good':'bad');
  else lower(match==='best'?`Great call! ${QB} to ${WR} — ${gain} yards!`:`${QB} to ${WR}${note?` (${note})`:''} — ${gain} yards`,'good');
  await wait(1200);
  G.toGo-=gain;
  if(G.toGo<=0){ G.down=1; G.toGo=Math.min(10,100-G.pos); lower('FIRST DOWN!','good'); roar(.6,1.3); updateBoard(); await wait(1000); }
  else { G.down++; updateBoard(); if(G.down>4){ lower('Turnover on downs','bad'); await wait(1300); return goTo('defense',G.pos); } }
  goTo('play');
}
async function touchdown(carrier,name){
  G.home+=6; updateBoard(); roar(1.5,3.8); horn(); setTimeout(fanfare,700); confetti();
  lower(`TOUCHDOWN ${name?name.toUpperCase():T().name.toUpperCase()}!`,'good');
  waiting('TOUCHDOWN');
  await celebrate(carrier);
  const before=G.home, R=RS(G.homeT);
  const p=G.level===0
    ? {text:'6 + 1', answer:7, vis:{k:'add',a:6,b:1}}
    : {text:`You have <b>${before}</b> points.<br>The kick adds <b>1</b> more.<br>What's your new score?`, answer:before+1, story:true, vis:{k:'up',a:before,b:1}};
  const res=await ask(p,{title:'EXTRA POINT', color:'#8a6512', sit:`${last(R.K[1])} #${R.K[0]} to kick`, contText:'Kick it ▶'});
  if(G.quit) return;
  waiting();
  await animPlay('home',85,{kind:'fg',good:res.ok});
  if(res.ok){ G.home+=1; cardXP('K'); lower(`${last(R.K[1])}'s extra point is good`,'good'); } else lower('Extra point missed','bad');
  updateBoard(); await wait(1200);
  goTo('defense',75);
}
async function fieldGoal(){
  const lv=G.level, n=lv===0?r(2,3):lv===1?r(2,5):r(3,10), R=RS(G.homeT);
  const seq=Array.from({length:n-1},(_,i)=>3*(i+1)).join(', ');
  const p=lv===0
    ? {text:`Field goals are worth 3.<br>Count by 3s: <b>${seq}, __</b>`, answer:3*n, story:true, vis:{k:'mul',a:n,b:3}}
    : {text:`3 × ${n}`, answer:3*n, vis:{k:'mul',a:3,b:n}, key:`3x${n}`, diff:'hard'};
  waiting();
  await setFormation('home',G.pos,'kick');
  const res=await ask(p,{title:'FIELD GOAL · 3 PTS', color:'#8a6512', sit:`${100-G.pos+17} yards · ${last(R.K[1])} #${R.K[0]}`, contText:'Kick it ▶'});
  if(G.quit) return;
  waiting();
  await animPlay('home',G.pos,{kind:'fg',good:res.ok});
  runClock(r(5,8));
  if(res.ok){ G.home+=3; cardXP('K'); updateBoard(); fanfare(); lower(`${last(R.K[1])} — IT'S GOOD! +3`,'good'); } else lower('No good — wide','bad');
  await wait(1500); goTo('defense',75);
}
async function punt(){
  waiting();
  const land=Math.min(92,G.pos+r(38,45));
  await animPlay('home',G.pos,{kind:'punt',land});
  runClock(r(8,12)); lower('Booming punt','info'); await wait(1000);
  goTo('defense',land);
}

/* ---------- defense: the opponent drives one play at a time ----------
   Every opponent snap is one problem. A right answer usually stops the play
   (sack, broken-up pass, short gain); a wrong answer gives up a big gain.
   Normal downs decide when they punt, kick or score, so it feels like football.
   The Opponent setting controls how often they make a play anyway. */
const OPP={easy:{luck:.03,good:[[.27,'sack'],[.36,'inc'],[.25,'run',0,2],[.12,'pass',3,5]],fg:.65},
           normal:{luck:.25,good:[[.15,'sack'],[.25,'inc'],[.25,'run',1,4],[.35,'pass',4,8]],fg:.85},
           tough:{luck:.3,good:[[.12,'sack'],[.22,'inc'],[.26,'run',2,5],[.4,'pass',5,9]],fg:.92}};
async function defense(bStart){
  if(G.quit) return;
  if(G.ot && G.home>G.away) return endGame();
  const R=RS(G.awayT), on=O().name, S=OPP[saved.opp]||OPP.normal;
  G.offSide='away'; G.lines=false; G.look=null;
  let bpos=Math.round(bStart); G.bDown=1; G.bToGo=Math.min(10,bpos); updateBoard(); waiting();
  await setFormation('away',bpos);
  lower(`${on} ball — defense, let's go!`,'info'); claps();
  await wait(900);
  let start=25, plays=0;
  while(true){
    if(G.quit) return;
    // 4th down: kick or punt
    if(G.bDown===4){
      if(bpos<=35){
        const good=Math.random()<S.fg;
        await setFormation('away',bpos,'kick');
        await animPlay('away',bpos,{kind:'fg',good});
        runClock(r(5,8));
        if(good){ G.away+=3; lower(`${last(R.K[1])} field goal is good. ${on} +3`,'bad'); }
        else lower(`${last(R.K[1])} misses the field goal!`,'good');
        start= good?25:Math.max(20,Math.min(80,bpos+7));
      } else {
        const land=Math.max(8,bpos-r(38,44));
        await animPlay('away',bpos,{kind:'punt',land});
        runClock(r(8,12)); lower(`Defense holds — ${on} punt`,'good');
        start=Math.max(20,land);
      }
      break;
    }
    const p=gen(pick(['easy','medium','medium']));
    const goal=bpos<=G.bToGo;
    const a=await ask(p,{title:`DEFENSE · ${ord(G.bDown).toUpperCase()} & ${goal?'GOAL':G.bToGo}`, color:'#8a2a1e', sit:`${last(R.QB[1])} and the ${on} at ${spotText(bpos)}`, clock:G.pclock, burstText:'LIGHTNING DEFENSE — sack!', contText:'Next play ▶'});
    if(G.quit) return;
    plays++;
    const wi=r(0,2), WRn=last(R.WR[wi][1]), RBn=last(R.RB[1]), QBn=last(R.QB[1]);
    let spec, msg, good=true;
    if(a.ok && Math.random()<.06){ spec={kind:'int'}; }
    else if(a.ok && (a.fast || Math.random()>=S.luck)){
      let x=Math.random(), o=S.good[S.good.length-1];
      for(const row of S.good){ if(x<row[0]){ o=row; break; } x-=row[0]; }
      if(a.fast) o=[0,'sack'];
      if(o[1]==='sack'){ spec={kind:'sack',gain:-r(5,8)}; msg=`${QBn} SACKED!`; }
      else if(o[1]==='inc'){ spec={kind:'inc'}; msg='Pass broken up!'; }
      else if(o[1]==='run'){ const g=r(o[2],o[3]); spec={kind:'run',gain:g}; msg=`${RBn} stopped after ${g}`; }
      else { const g=r(o[2],o[3]); spec={kind:'pass',gain:g}; msg=`Short catch by ${WRn}, ${g} yards — tackled`; }
    } else {
      const g=a.ok? r(12,22) : r(8,18);
      spec=pick([{kind:'run',gain:g},{kind:'pass',gain:g}]); good=false;
      msg= a.ok? `Right answer, but ${spec.kind==='run'?RBn:WRn} made a great play — ${g} yards` : (spec.kind==='run'?`${RBn} breaks free for ${g}`:`${QBn} hits ${WRn} for ${g}`);
    }
    spec.target='WR'+(wi+1);
    if(spec.gain && bpos-spec.gain<=0){ spec.gain=bpos; spec.td=true; }
    if(spec.kind==='sack') spec.gain=-Math.min(-spec.gain,97-bpos);
    waiting();
    const out=await animPlay('away',bpos,spec);
    if(G.quit) return;
    if(spec.kind==='int'){
      start=Math.max(20,Math.min(80,Math.round(out.intPos)));
      lower('INTERCEPTION! What a defense!','good'); confetti(); runClock(r(6,10));
      break;
    }
    runClock(spec.kind==='inc'?r(5,8):r(24,36));
    if(spec.td){ G.away+=7; aww(); lower(`Touchdown ${spec.kind==='run'?RBn:WRn}. ${on} +7`,'bad'); break; }
    const gn=spec.gain||0; bpos=Math.max(1,Math.min(97,bpos-gn));
    lower(msg, good?'good':'bad');
    G.bToGo-=gn;
    if(G.bToGo<=0){ G.bDown=1; G.bToGo=Math.min(10,bpos); updateBoard(); await wait(900); lower(`${on} first down`,'bad'); }
    else { G.bDown++; updateBoard(); }
    await wait(900);
    if(!G.ot && G.clock<=0){ if(G.q===1||G.q===3){ lower(`End of the ${ord(G.q)} quarter`,'info'); await wait(1200); G.q++; G.clock=G.qLen; updateBoard(); } else break; }   // half / game ends mid-drive
    await setFormation('away',bpos);
  }
  updateBoard(); await wait(1700);
  if(G.ot) return endGame();
  goTo('drive',start);
}

/* =========================================================
   HALFTIME STAT ATTACK (retro LED board)
   ========================================================= */
function statAttack(){
  return new Promise(resolve=>{
    const gid=GAME;
    const others=Object.keys(TEAMS).filter(k=>k!==G.homeT&&k!==G.awayT);
    const ids=[G.homeT,G.awayT,pick(others)].sort(()=>Math.random()-.5);
    const [A,B,C]=ids, lv=G.level;
    const d= lv===0?r(2,5):lv===1?r(5,12):r(10,25);
    const bY= lv===0?r(9,14):r(18,35), aY=bY+d, cY=bY-(lv===0?r(2,5):r(4,10));
    const verb=pick([['ran for','1st half rushing'],['threw for','1st half passing']]);
    const rows=[{y:aY,t:A},{y:bY,t:B},{y:cY,t:C}].sort(()=>Math.random()-.5);
    const fill=[null,null,null]; let sel=null, done=false;
    dim(true);
    const show=(result)=>{
      $('#panel').innerHTML=`<div class="led">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><span class="ledt" style="font-size:24px">HALFTIME STAT ATTACK</span><span class="ledg" style="font-size:15px">${verb[1].toUpperCase()}</span></div>
        <div class="clue">The ${TEAMS[A].name} ${verb[0]} <b>${d} more yards</b> than the ${TEAMS[B].name}. The ${TEAMS[C].name} had the <b>fewest</b>. Who's who?</div>
        <div class="match">
          <div class="chips"><span class="label" style="text-align:center">1. Tap a team</span>${ids.map(id=>`<button class="chip ${sel===id?'sel':''} ${fill.includes(id)?'used':''}" data-c="${id}">${TEAMS[id].name}</button>`).join('')}</div>
          <div class="rows"><span class="h">2. Tap its box</span><span class="h">YARDS</span>${rows.map((rw,i)=>{ const st=result?(fill[i]===rw.t?'right':'wrong'):''; return `<button class="slot ${fill[i]?'':'empty'} ${st}" data-s="${i}">${fill[i]?TEAMS[fill[i]].name:'FILL ME IN'}${result&&fill[i]!==rw.t?`<br><small style="color:#5fe08a">${TEAMS[rw.t].name}</small>`:''}</button><div class="num">${rw.y}</div>`; }).join('')}</div>
        </div>
        ${result?`<div class="ledt" style="font-size:18px;text-align:center">${result==='win'?'ALL RIGHT! +15 YARD KICKOFF RETURN':'NICE TRY! CHECK THE GREEN NAMES'}</div><button class="cont" id="go2">Start the 2nd half ▶</button>`
        :`<button class="hike" id="chk" aria-label="Check answers"><svg width="170" height="95" viewBox="0 0 200 112"><ellipse cx="100" cy="56" rx="96" ry="52" fill="#7b3f13" stroke="#2e1505" stroke-width="5"/><path d="M22 30 Q100 2 178 30 M22 82 Q100 110 178 82" stroke="#f3e2c0" stroke-width="5" fill="none"/><text x="100" y="72" text-anchor="middle" font-family="Saira Condensed" font-weight="900" font-size="46" fill="#ffd23f" stroke="#2e1505" stroke-width="4" paint-order="stroke">CHECK</text></svg></button>`}
      </div>`;
      if(result){ $('#go2').onclick=()=>{ if(gid!==GAME) return; dim(false); resolve(result==='win'); }; return; }
      $('.chips').onclick=e=>{ const b=e.target.closest('.chip'); if(!b)return; sel=b.dataset.c; tone(700,.05,'triangle',.06); show(); };
      $('.rows').onclick=e=>{ const b=e.target.closest('.slot'); if(!b)return; const i=+b.dataset.s; if(sel){ const prev=fill.indexOf(sel); if(prev>=0) fill[prev]=null; fill[i]=sel; sel=null; } else fill[i]=null; tone(500,.05,'triangle',.06); show(); };
      $('#chk').onclick=()=>{ if(fill.some(f=>!f)){ lower('Fill in all three boxes first','info'); return; }
        const win=rows.every((rw,i)=>fill[i]===rw.t); G.total++; if(win){ G.right++; ding(); roar(1,1.8); G.streak=Math.min(9,G.streak+3); } else bonk(); updateBoard(); show(win?'win':'lose'); };
    };
    G._panel=()=>show(); show();
  });
}

/* ---------- end ---------- */
function endGame(){
  if(G.quit) return;
  G.offSide='home'; G.clock=Math.max(0,G.clock); updateBoard(); const dd=$('#dd'); if(dd) dd.textContent='FINAL';
  const win=G.home>G.away, tie=G.home===G.away;
  if(win) saved.record.w++; else if(tie) saved.record.t++; else saved.record.l++;
  store.set(saved);
  if(!win&&!tie) setTimeout(loseJingle,300);
  if(win){ roar(1.5,4.5); horn(); setTimeout(winJingle,600); confetti(); setTimeout(confetti,900); G.cheerUntil=performance.now()+5000; }
  const pct=G.total?Math.round(G.right/G.total*100):0;
  lower(win?`${T().name.toUpperCase()} WIN!`:tie?'TIE GAME':'FINAL',win?'good':'info');
  const chips=G.missed.filter(m=>!m.includes('<')).slice(0,12);
  setPanel(`<div class="end">
      <h2>${win?'VICTORY':tie?'TIE GAME':'GOOD GAME'}</h2>
      <div class="final">${T().name} ${G.home} – ${G.away} ${O().name}</div>
      <div class="statrow"><div class="stat glass"><b>${G.right}/${G.total}</b>problems right</div><div class="stat glass"><b>${pct}%</b>accuracy</div>${G.pclock?`<div class="stat glass"><b>${G.bursts}</b>bursts</div>`:''}<div class="stat glass"><b>${saved.record.w}–${saved.record.l}${saved.record.t?`–${saved.record.t}`:''}</b>record</div></div>
      ${chips.length?`<div class="practice glass">Coach's practice list<div class="pchips">${chips.map(m=>`<span class="pchip">${m}</span>`).join('')}</div></div>`:`<div class="practice glass">No missed facts this game!</div>`}
      <div class="extras"><button class="cta" id="again">PLAY AGAIN</button></div>
    </div>`, ()=>{ $('#again').onclick=startScreen; });
}

startScreen();
</script>
